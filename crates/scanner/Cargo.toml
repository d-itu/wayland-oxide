[package]
name = "wayland-oxide-scanner"
version.workspace = true
edition.workspace = true
description = "Generate code for `wayland-oxide` from xml"
license.workspace = true

[dependencies]
prettyplease = "*"
proc-macro2 = "1"
quick-xml = { version = "*", features = ["overlapped-lists", "serialize"] }
quote = { version = "1" }
serde = { version = "1", features = ["derive"] }
syn = { version = "2" }
