[package]
name = "wayland-oxide-scanner"
version.workspace = true
edition.workspace = true
description = "Generate code for `wayland-oxide` from xml"
repository.workspace = true
license.workspace = true

[dependencies]
prettyplease = "0"
proc-macro2 = "1"
quick-xml = { version = "0", features = ["overlapped-lists", "serialize"] }
quote = { version = "1" }
serde = { version = "1", features = ["derive"] }
syn = { version = "3" }
