name: Rust release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo publish --dry-run -p wayland-oxide-scanner --locked
      - run: cargo publish --dry-run -p wayland-oxide --locked

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag against package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '
            [.packages[] | select(.name == "wayland-oxide" or .name == "wayland-oxide-scanner") | .version]
            | unique
            | if length == 1 then .[0] else error("package versions differ") end
          ')
          test "$RELEASE_TAG" = "v$version"
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p wayland-oxide-scanner --locked
          cargo publish -p wayland-oxide --locked
