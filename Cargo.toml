[workspace]
resolver = "3"
members = [
  "crates/*",

  "examples",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/d-itu/wayland-oxide"
license = "MIT"

[workspace.dependencies]
wayland-oxide = { path = "crates/wayland-oxide", version = "0.2.0" }
wayland-oxide-scanner = { path = "crates/scanner", version = "0.2.0" }
