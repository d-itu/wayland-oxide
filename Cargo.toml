[package]
name = "wayland-oxide"
edition.workspace = true

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[dependencies]
bitflags = { version = "2.11.1", default-features = false, features = [] }
thiserror = { version = "2.0.18", default-features = false }
tuplez = { version = "0.15.0", default-features = false, features = ["unwrap"] }

[features]
default = []
std = []
